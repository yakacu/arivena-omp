preset: openmp
site: ""
user: "yakacu"
repo: "arivena-omp"
entry: gamemodes\main.pwn
output: gamemodes\main.amx
#entry: filterscripts\mapping.pwn
#output: filterscripts\mapping.amx
dependencies:
    - openmultiplayer/omp-stdlib
    - pawn-lang/samp-stdlib@open.mp
    - pawn-lang/pawn-stdlib@open.mp
    - oscar-broman/samp-weapon-config
    - Zeex/samp-plugin-crashdetect:v4.22
    - pBlueG/SA-MP-MySQL:R41-4
    - Kirima2nd/mSelection
    - samp-incognito/samp-streamer-plugin:v2.9.5
    - Y-Less/sscanf:v2.13.8
    - Sreyas-Sreelal/samp-bcrypt:0.3.4
    - pawn-lang/YSI-Includes:nightly
    - Southclaws/progress2
    - Nickk888SAMP/Dialog-Pages:3.2.0
    - kristoisberg/samp-td-string-width
    - kristoisberg/samp-screen-colour-fader
    - nexquery/samp-textdraw-streamer:v1.6.2
local: true
runtime:
    type: openmp
    mode: server
    filterscripts:
        #- aview
        #- mainan
        - mapping
        - testvoice
        - hotkeys
        #- ddos
        #- AC_Black_Diamond
        #- xmas
    plugins:
        #- FileManager
        - sampvoice
        - KeyListener
    rcon_password: password
    port: 7778
    hostname: ARIVENA RP
    maxplayers: 50
    language: ""
    mapname: San Andreas
    weburl: www.sa-mp.com
    gamemodetext: Unknown
    announce: true
    lanmode: false
    query: true
    rcon: false
    logqueries: false
    sleep: 5
    maxnpc: 2
    stream_rate: 1000
    stream_distance: 200
    onfoot_rate: 30
    incar_rate: 30
    weapon_rate: 30
    chatlogging: true
    timestamp: true
    messageholelimit: 3000
    messageslimit: 500
    ackslimit: 10000
    playertimeout: 10000
    minconnectiontime: 0
    lagcompmode: 1
    connseedtime: 300000
    db_logging: false
    db_log_queries: false
    conncookies: true
    cookielogging: false
    output: true
    extra:
        long_call_time: "0"
        sv_port: "12148"
builds:
    - name: main
      args:
        - -;+
        - -(+
        - -d2
        - -w213
        - -w203
        - -w234
      includes:
        - gamemodes/core
        - gamemodes/utils
        - legacy
